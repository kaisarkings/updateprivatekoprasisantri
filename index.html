    <script>
      // Ensure React Refresh preamble globals exist synchronously before any module executes
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // Ignore transient WebSocket disconnects from Vite HMR in preview environments
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (msg.indexOf('WebSocket') !== -1) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
